<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name=viewport content="width=device-width,shrink-to-fit=0,user-scalable=no,minimum-scale=1,maximum-scale=1">
	<title>Neesta®™©</title>
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body { background: #30332c; overflow: hidden; width: 100vw; height: 100vh; }
		canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: block; }
	</style>
</head>
<body>
	<canvas id="fluid"></canvas>
	<script>
	(() => {
		const canvas = document.getElementById('fluid');
		let W = canvas.width = window.innerWidth;
		let H = canvas.height = window.innerHeight;

		const CFG = {
			SIM_RES:        128,
			DYE_RES:        256,
			DYE_DISS:       0.994,
			VEL_DISS:       0.999,
			PRESSURE:       0.6,
			PRESSURE_ITERS: 20,
			CURL:           8,
			SPLAT_R:        0.006,
			SPLAT_F:        800,
			DT_SCALE:       0.35,
		};

		// Convert HSL to RGB — used to derive color from mouse position
		function hsl(h, s, l) {
			h = h % 360;
			const c = (1 - Math.abs(2 * l - 1)) * s;
			const x = c * (1 - Math.abs((h / 60) % 2 - 1));
			const m = l - c / 2;
			let r = 0, g = 0, b = 0;
			if      (h < 60)  { r = c; g = x; }
			else if (h < 120) { r = x; g = c; }
			else if (h < 180) { g = c; b = x; }
			else if (h < 240) { g = x; b = c; }
			else if (h < 300) { r = x; b = c; }
			else              { r = c; b = x; }
			return [r + m, g + m, b + m];
		}

		let globalHueShift = Math.random() * 360;

		// Returns a subtle muted color from mouse position — narrow hue range, low saturation
		function colorFromPos(nx, ny) {
			const hue = (globalHueShift + (nx - 0.5) * 30 + (ny - 0.5) * 20) % 360;
			const sat = 0.12 + ny * 0.06;
			return hsl(hue, sat, 0.13);
		}

		let autoHue = Math.random() * 360;

		const gl = canvas.getContext('webgl', { alpha: false, depth: false, stencil: false, antialias: false });
		if (!gl) return;

		const extHF  = gl.getExtension('OES_texture_half_float');
		const extHFL = gl.getExtension('OES_texture_half_float_linear');
		const DTYPE  = extHF  ? extHF.HALF_FLOAT_OES : gl.UNSIGNED_BYTE;
		const FILTER = extHFL ? gl.LINEAR : gl.NEAREST;

		const VERT = `
			precision highp float;
			attribute vec2 aPos;
			varying vec2 vUv, vL, vR, vT, vB;
			uniform vec2 texelSize;
			void main() {
				vUv = aPos * 0.5 + 0.5;
				vL  = vUv - vec2(texelSize.x, 0.);
				vR  = vUv + vec2(texelSize.x, 0.);
				vT  = vUv + vec2(0., texelSize.y);
				vB  = vUv - vec2(0., texelSize.y);
				gl_Position = vec4(aPos, 0., 1.);
			}
		`;

		const FRAGS = {
			clear: `
				precision highp float;
				varying vec2 vUv;
				uniform sampler2D uTexture;
				uniform float value;
				void main() { gl_FragColor = value * texture2D(uTexture, vUv); }
			`,
			splat: `
				precision highp float;
				varying vec2 vUv;
				uniform sampler2D uTarget;
				uniform float aspectRatio, radius;
				uniform vec3 color;
				uniform vec2 point;
				void main() {
					vec2 p = vUv - point;
					p.x *= aspectRatio;
					float sp = exp(-dot(p, p) / radius);
					gl_FragColor = vec4(texture2D(uTarget, vUv).xyz + sp * color, 1.);
				}
			`,
			advect: `
				precision highp float;
				varying vec2 vUv;
				uniform sampler2D uVelocity, uSource;
				uniform vec2 texelSize, dyeTexelSize;
				uniform float dt, dissipation;
				vec4 bilerp(sampler2D s, vec2 uv, vec2 ts) {
					vec2 st = uv / ts - 0.5;
					vec2 f  = fract(st);
					vec2 b  = (floor(st) + 0.5) * ts;
					vec4 a0 = texture2D(s, b);
					vec4 a1 = texture2D(s, b + vec2(ts.x, 0.));
					vec4 a2 = texture2D(s, b + vec2(0., ts.y));
					vec4 a3 = texture2D(s, b + ts);
					return mix(mix(a0, a1, f.x), mix(a2, a3, f.x), f.y);
				}
				void main() {
					vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;
					vec4 r = dissipation * bilerp(uSource, coord, dyeTexelSize);
					gl_FragColor = vec4(r.rgb, 1.);
				}
			`,
			div: `
				precision highp float;
				varying vec2 vL, vR, vT, vB;
				uniform sampler2D uVelocity;
				void main() {
					float L = texture2D(uVelocity, vL).x;
					float R = texture2D(uVelocity, vR).x;
					float T = texture2D(uVelocity, vT).y;
					float B = texture2D(uVelocity, vB).y;
					gl_FragColor = vec4(0.5 * (R - L + T - B), 0., 0., 1.);
				}
			`,
			curl: `
				precision highp float;
				varying vec2 vL, vR, vT, vB;
				uniform sampler2D uVelocity;
				void main() {
					float L = texture2D(uVelocity, vL).y;
					float R = texture2D(uVelocity, vR).y;
					float T = texture2D(uVelocity, vT).x;
					float B = texture2D(uVelocity, vB).x;
					gl_FragColor = vec4(0.5 * (R - L - T + B), 0., 0., 1.);
				}
			`,
			vorticity: `
				precision highp float;
				varying vec2 vUv, vL, vR, vT, vB;
				uniform sampler2D uVelocity, uCurl;
				uniform float curl, dt;
				void main() {
					float L = texture2D(uCurl, vL).x;
					float R = texture2D(uCurl, vR).x;
					float T = texture2D(uCurl, vT).x;
					float B = texture2D(uCurl, vB).x;
					float C = texture2D(uCurl, vUv).x;
					vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
					force /= length(force) + 1e-5;
					force *= curl * C;
					force.y *= -1.;
					gl_FragColor = vec4(texture2D(uVelocity, vUv).xy + force * dt, 0., 1.);
				}
			`,
			pressure: `
				precision highp float;
				varying vec2 vUv, vL, vR, vT, vB;
				uniform sampler2D uPressure, uDivergence;
				void main() {
					float L = texture2D(uPressure, vL).x;
					float R = texture2D(uPressure, vR).x;
					float T = texture2D(uPressure, vT).x;
					float B = texture2D(uPressure, vB).x;
					float C = texture2D(uDivergence, vUv).x;
					gl_FragColor = vec4((L + R + B + T - C) * 0.25, 0., 0., 1.);
				}
			`,
			grad: `
				precision highp float;
				varying vec2 vUv, vL, vR, vT, vB;
				uniform sampler2D uPressure, uVelocity;
				void main() {
					float L = texture2D(uPressure, vL).x;
					float R = texture2D(uPressure, vR).x;
					float T = texture2D(uPressure, vT).x;
					float B = texture2D(uPressure, vB).x;
					vec2 v = texture2D(uVelocity, vUv).xy;
					gl_FragColor = vec4(v - vec2(R - L, T - B), 0., 1.);
				}
			`,
			display: `
				precision highp float;
				varying vec2 vUv;
				uniform sampler2D uTexture;
				void main() {
					vec3 bg = vec3(0.188, 0.200, 0.173);
					vec3 c  = clamp(texture2D(uTexture, vUv).rgb, 0., 1.);
					float p = min(length(c) * 6., 1.);
					gl_FragColor = vec4(mix(bg, c + bg, p), 1.);
				}
			`,
		};

		function makeProgram(fragSrc) {
			function shader(type, src) {
				const s = gl.createShader(type);
				gl.shaderSource(s, src);
				gl.compileShader(s);
				return s;
			}
			const p = gl.createProgram();
			gl.attachShader(p, shader(gl.VERTEX_SHADER, VERT));
			gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fragSrc));
			gl.linkProgram(p);
			const u = {};
			const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
			for (let i = 0; i < n; i++) {
				const info = gl.getActiveUniform(p, i);
				u[info.name] = gl.getUniformLocation(p, info.name);
			}
			return { p, u };
		}

		const PROG = Object.fromEntries(Object.entries(FRAGS).map(([k, v]) => [k, makeProgram(v)]));

		const quadBuf = gl.createBuffer();
		gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
		gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

		let cur = null;
		function use(prog) {
			if (cur !== prog) {
				gl.useProgram(prog.p);
				gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
				const loc = gl.getAttribLocation(prog.p, 'aPos');
				gl.enableVertexAttribArray(loc);
				gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
				cur = prog;
			}
		}

		function blit(target) {
			gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fbo : null);
			gl.viewport(0, 0, target ? target.w : W, target ? target.h : H);
			gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
		}

		function bindTex(unit, tex) {
			gl.activeTexture(gl.TEXTURE0 + unit);
			gl.bindTexture(gl.TEXTURE_2D, tex);
			return unit;
		}

		function makeFBO(w, h) {
			const tex = gl.createTexture();
			gl.bindTexture(gl.TEXTURE_2D, tex);
			gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, FILTER);
			gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, FILTER);
			gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
			gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
			gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, DTYPE, null);
			const fbo = gl.createFramebuffer();
			gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
			gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
			gl.clear(gl.COLOR_BUFFER_BIT);
			return { tex, fbo, w, h, sx: 1/w, sy: 1/h };
		}

		function makeDouble(w, h) {
			let a = makeFBO(w, h), b = makeFBO(w, h);
			return { read: a, write: b, swap() { [this.read, this.write] = [this.write, this.read]; }, w, h, sx: 1/w, sy: 1/h };
		}

		function getRes(base) {
			const ar = W / H;
			return ar > 1 ? { w: Math.round(base * ar), h: base } : { w: base, h: Math.round(base / ar) };
		}

		let sr = getRes(CFG.SIM_RES), dr = getRes(CFG.DYE_RES);
		let vel = makeDouble(sr.w, sr.h);
		let dye = makeDouble(dr.w, dr.h);
		let divFBO  = makeFBO(sr.w, sr.h);
		let curlFBO = makeFBO(sr.w, sr.h);
		let pres    = makeDouble(sr.w, sr.h);

		function step(dt) {
			gl.disable(gl.BLEND);

			use(PROG.curl);
			gl.uniform2f(PROG.curl.u.texelSize, vel.sx, vel.sy);
			gl.uniform1i(PROG.curl.u.uVelocity, bindTex(0, vel.read.tex));
			blit(curlFBO);

			use(PROG.vorticity);
			gl.uniform2f(PROG.vorticity.u.texelSize, vel.sx, vel.sy);
			gl.uniform1i(PROG.vorticity.u.uVelocity, bindTex(0, vel.read.tex));
			gl.uniform1i(PROG.vorticity.u.uCurl,     bindTex(1, curlFBO.tex));
			gl.uniform1f(PROG.vorticity.u.curl, CFG.CURL);
			gl.uniform1f(PROG.vorticity.u.dt, dt);
			blit(vel.write); vel.swap();

			use(PROG.div);
			gl.uniform2f(PROG.div.u.texelSize, vel.sx, vel.sy);
			gl.uniform1i(PROG.div.u.uVelocity, bindTex(0, vel.read.tex));
			blit(divFBO);

			use(PROG.clear);
			gl.uniform1i(PROG.clear.u.uTexture, bindTex(0, pres.read.tex));
			gl.uniform1f(PROG.clear.u.value, CFG.PRESSURE);
			blit(pres.write); pres.swap();

			use(PROG.pressure);
			gl.uniform2f(PROG.pressure.u.texelSize, vel.sx, vel.sy);
			gl.uniform1i(PROG.pressure.u.uDivergence, bindTex(0, divFBO.tex));
			for (let i = 0; i < CFG.PRESSURE_ITERS; i++) {
				gl.uniform1i(PROG.pressure.u.uPressure, bindTex(1, pres.read.tex));
				blit(pres.write); pres.swap();
			}

			use(PROG.grad);
			gl.uniform2f(PROG.grad.u.texelSize, vel.sx, vel.sy);
			gl.uniform1i(PROG.grad.u.uPressure, bindTex(0, pres.read.tex));
			gl.uniform1i(PROG.grad.u.uVelocity, bindTex(1, vel.read.tex));
			blit(vel.write); vel.swap();

			use(PROG.advect);
			gl.uniform2f(PROG.advect.u.texelSize, vel.sx, vel.sy);
			gl.uniform2f(PROG.advect.u.dyeTexelSize, vel.sx, vel.sy);
			gl.uniform1i(PROG.advect.u.uVelocity, bindTex(0, vel.read.tex));
			gl.uniform1i(PROG.advect.u.uSource,   bindTex(1, vel.read.tex));
			gl.uniform1f(PROG.advect.u.dt, dt);
			gl.uniform1f(PROG.advect.u.dissipation, CFG.VEL_DISS);
			blit(vel.write); vel.swap();

			gl.uniform2f(PROG.advect.u.texelSize, vel.sx, vel.sy);
			gl.uniform2f(PROG.advect.u.dyeTexelSize, dye.sx, dye.sy);
			gl.uniform1i(PROG.advect.u.uVelocity, bindTex(0, vel.read.tex));
			gl.uniform1i(PROG.advect.u.uSource,   bindTex(1, dye.read.tex));
			gl.uniform1f(PROG.advect.u.dissipation, CFG.DYE_DISS);
			blit(dye.write); dye.swap();
		}

		function splat(x, y, dx, dy, color) {
			use(PROG.splat);
			const ar = W / H;
			gl.uniform1i(PROG.splat.u.uTarget, bindTex(0, vel.read.tex));
			gl.uniform1f(PROG.splat.u.aspectRatio, ar);
			gl.uniform2f(PROG.splat.u.point, x / W, 1 - y / H);
			gl.uniform3f(PROG.splat.u.color, dx, -dy, 0);
			gl.uniform1f(PROG.splat.u.radius, CFG.SPLAT_R);
			blit(vel.write); vel.swap();

			gl.uniform1i(PROG.splat.u.uTarget, bindTex(0, dye.read.tex));
			gl.uniform3f(PROG.splat.u.color, color[0], color[1], color[2]);
			blit(dye.write); dye.swap();
		}

		function autoSplat() {
			autoHue = (autoHue + 3 + Math.random() * 5) % 360;
			const c = hsl(autoHue, 0.14, 0.12);
			const x = W * (0.25 + Math.random() * 0.5);
			const y = H * (0.25 + Math.random() * 0.5);
			const a = Math.random() * Math.PI * 2;
			const f = CFG.SPLAT_F * (0.5 + Math.random() * 0.5);
			splat(x, y, Math.cos(a) * f, Math.sin(a) * f, c);
		}

		for (let i = 0; i < 3; i++) autoSplat();
		setInterval(autoSplat, 7000);

		let lastPointer = null;

		function onMove(x, y) {
			const c = colorFromPos(x / W, y / H);
			if (lastPointer) {
				const dx = (x - lastPointer.x) * CFG.SPLAT_F * 0.15;
				const dy = (y - lastPointer.y) * CFG.SPLAT_F * 0.15;
				splat(x, y, dx, dy, c);
			}
			lastPointer = { x, y };
		}

		window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
		window.addEventListener('mouseleave', () => { lastPointer = null; });

		window.addEventListener('touchstart', e => {
			const t = e.touches[0];
			lastPointer = { x: t.clientX, y: t.clientY };
		}, { passive: true });

		window.addEventListener('touchmove', e => {
			e.preventDefault();
			for (const t of e.touches) onMove(t.clientX, t.clientY);
		}, { passive: false });

		window.addEventListener('touchend', () => { lastPointer = null; });

		// ── Pixel rain ──────────────────────────────────────────────────────────
		let mode = 'webgl';
		const rainCanvas = document.createElement('canvas');
		rainCanvas.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;display:none;cursor:none;';
		document.body.appendChild(rainCanvas);
		const rc = rainCanvas.getContext('2d');
		let rainParticles = [];
		let mouseRain = { x: W / 2, y: H / 2 };

		function rainColor() {
			const h = (globalHueShift + (Math.random() - 0.5) * 40) % 360;
			const [r, g, b] = hsl(h, 0.25 + Math.random() * 0.15, 0.45 + Math.random() * 0.25);
			return `rgb(${(r*255)|0},${(g*255)|0},${(b*255)|0})`;
		}

		class RainPixel {
			constructor(x, y) {
				this.x = x + (Math.random() - 0.5) * 30;
				this.y = y;
				this.vx = (Math.random() - 0.5) * 0.8;
				this.vy = 1.5 + Math.random() * 3.5;
				this.size = 2 + Math.floor(Math.random() * 3);
				this.color = rainColor();
				this.life = 1;
				this.decay = 0.004 + Math.random() * 0.008;
			}
			update() {
				this.x += this.vx;
				this.y += this.vy;
				this.vy += 0.08;
				this.life -= this.decay;
			}
		}

		let rainRaf = null;
		function animateRain() {
			if (mode !== 'rain') return;
			rainRaf = requestAnimationFrame(animateRain);

			for (let i = 0; i < 4; i++) rainParticles.push(new RainPixel(mouseRain.x, mouseRain.y));

			rc.fillStyle = 'rgba(48,51,44,0.18)';
			rc.fillRect(0, 0, rainCanvas.width, rainCanvas.height);

			rainParticles = rainParticles.filter(p => p.life > 0 && p.y < rainCanvas.height + 20);
			for (const p of rainParticles) {
				p.update();
				rc.globalAlpha = p.life * 0.9;
				rc.fillStyle = p.color;
				rc.fillRect(p.x | 0, p.y | 0, p.size, p.size);
			}
			rc.globalAlpha = 1;
		}

		window.addEventListener('click', () => {
			if (mode === 'webgl') {
				mode = 'rain';
				rainCanvas.width = W;
				rainCanvas.height = H;
				rainParticles = [];
				rc.fillStyle = '#30332c';
				rc.fillRect(0, 0, W, H);
				rainCanvas.style.display = 'block';
				animateRain();
			} else {
				mode = 'webgl';
				rainCanvas.style.display = 'none';
				if (rainRaf) { cancelAnimationFrame(rainRaf); rainRaf = null; }
			}
		});

		rainCanvas.addEventListener('mousemove', e => { mouseRain.x = e.clientX; mouseRain.y = e.clientY; });
		rainCanvas.addEventListener('touchmove', e => {
			e.preventDefault();
			mouseRain.x = e.touches[0].clientX;
			mouseRain.y = e.touches[0].clientY;
		}, { passive: false });
		// ────────────────────────────────────────────────────────────────────────

		let prev = performance.now();
		function animate(now) {
			requestAnimationFrame(animate);
			globalHueShift = (globalHueShift + 0.015) % 360;
			const dt = Math.min((now - prev) / 1000, 0.016) * CFG.DT_SCALE;
			prev = now;
			step(dt);
			use(PROG.display);
			gl.uniform1i(PROG.display.u.uTexture, bindTex(0, dye.read.tex));
			blit(null);
		}
		requestAnimationFrame(animate);

		window.addEventListener('resize', () => {
			W = canvas.width = window.innerWidth;
			H = canvas.height = window.innerHeight;
			const sr2 = getRes(CFG.SIM_RES), dr2 = getRes(CFG.DYE_RES);
			vel = makeDouble(sr2.w, sr2.h);
			dye = makeDouble(dr2.w, dr2.h);
			divFBO  = makeFBO(sr2.w, sr2.h);
			curlFBO = makeFBO(sr2.w, sr2.h);
			pres    = makeDouble(sr2.w, sr2.h);
		});
	})();
	</script>
</body>
</html>
